#
# End Dimension Strength - CMI alias
#
# INSTALL BOTH scripts (separate Global Player tabs):
#   1) EndDragon-Command.js     — event: trigger only  (reliable /enddragon)
#   2) End Dimension Strength.js — events: tick, kill, trigger, damagedEntity
#
# /enddragon  -> noppes script trigger 50 [playerName]
#
# The command script queues a spawn; End Strength processes it on tick
# (and also handles trigger 50 itself as a backup).
# asFakeOp! is fine — player is resolved from [playerName] / arguments[0].
#

CustomAlias:
  enddragon:
    Cmds:
    - asFakeOp! noppes script trigger 50 [playerName]
    AddTabs: true
    ExactMatch: true
  spawndragon:
    Cmds:
    - asFakeOp! noppes script trigger 50 [playerName]
    AddTabs: true
    ExactMatch: true
