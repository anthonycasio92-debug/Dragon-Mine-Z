#
# End Dimension Strength - CMI aliases
#
# REQUIRED:
#   End Dimension Strength.js → Global Player
#   events: tick, kill, trigger, damagedEntity
#
# Do NOT enable CustomNPCs Global Forge Scripts for this.
# asOp! below runs the trigger as a real player so Global Player
# scripts receive it. EndDragon-Forge-Trigger.js is optional legacy
# only (enabling CNPC forge causes EntityConstructing/Size NPE spam).
#
# /enddragon     -> trigger 50  (spawn)
# /cleardragons  -> trigger 51  (kill all ender dragons)
#

CustomAlias:
  enddragon:
    Cmds:
    - asOp! noppes script trigger 50 [playerName]
    AddTabs: true
    ExactMatch: true
  spawndragon:
    Cmds:
    - asOp! noppes script trigger 50 [playerName]
    AddTabs: true
    ExactMatch: true
  cleardragons:
    Cmds:
    - asOp! noppes script trigger 51 [playerName]
    AddTabs: true
    ExactMatch: true
  killdragons:
    Cmds:
    - asOp! noppes script trigger 51 [playerName]
    AddTabs: true
    ExactMatch: true
