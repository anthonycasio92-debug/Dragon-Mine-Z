#
# End Dimension Strength - CMI alias
# Requires End Dimension Strength.js in Global Player
# (events: tick, kill, trigger, damagedEntity) — OWN tab.
#
# /enddragon  -> noppes script trigger 50 [playerName]
#
# The script resolves the real player from [playerName] / arguments[0].
# asFakeOp! is fine — do not use event.entity as the spawn target.
#

CustomAlias:
  enddragon:
    Cmds:
    - asFakeOp! noppes script trigger 50 [playerName]
    AddTabs: true
    ExactMatch: true
  spawndragon:
    Cmds:
    - asFakeOp! noppes script trigger 50 [playerName]
    AddTabs: true
    ExactMatch: true
