#
# End Dimension Strength - CMI aliases
#
# REQUIRES BOTH scripts:
#   1) End Dimension Strength.js     → Global Player
#      events: tick, kill, trigger, damagedEntity
#   2) EndDragon-Forge-Trigger.js    → Global Forge Scripts
#      event: trigger
#
# Why Forge bridge?
#   CustomNPCs skips Global Player triggers when the command source is
#   FakePlayer / console. asFakeOp alone will silently do nothing.
#   Prefer asOp! below. The Forge bridge still covers FakeOp/console.
#
# /enddragon     -> trigger 50  (spawn)
# /cleardragons  -> trigger 51  (kill all ender dragons)
#

CustomAlias:
  enddragon:
    Cmds:
    - asOp! noppes script trigger 50 [playerName]
    AddTabs: true
    ExactMatch: true
  spawndragon:
    Cmds:
    - asOp! noppes script trigger 50 [playerName]
    AddTabs: true
    ExactMatch: true
  cleardragons:
    Cmds:
    - asOp! noppes script trigger 51 [playerName]
    AddTabs: true
    ExactMatch: true
  killdragons:
    Cmds:
    - asOp! noppes script trigger 51 [playerName]
    AddTabs: true
    ExactMatch: true
