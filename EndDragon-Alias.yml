#
# End Dimension Strength - CMI alias
#
# Requires BOTH:
#   1) End Dimension Strength.js  → Global Player (tick, kill, trigger, damagedEntity)
#   2) EndDragon-Forge-Trigger.js → Global Forge  (trigger)
#
# /enddragon  -> summons a stat-scaled Ender Dragon (trigger 50)
#
# Notes:
#   - Console / asFakeOp sources do not run Global Player triggers in CNPC.
#     The Forge bridge forwards trigger 50 to the named player.
#   - asOp! still works and avoids FakePlayer when possible.
#

CustomAlias:
  enddragon:
    Cmds:
    - asOp! noppes script trigger 50 [playerName]
    AddTabs: true
    ExactMatch: true
  spawndragon:
    Cmds:
    - asOp! noppes script trigger 50 [playerName]
    AddTabs: true
    ExactMatch: true
