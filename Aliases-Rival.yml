# ============================================================
# DBZ Legacy Reborn - Rival CMI Aliases (v4.6.18)
# Pair with Rival System.js + Rival Command Handler.js v4.6.18
# ============================================================
# Intended flow:
#   /rival <player>           -> silent Unknown (they see nothing)
#   both silent               -> Declared
#   /rival declare <player>   -> VISIBLE declare (they are notified)
#   both declare or accept    -> Mutual
#   Mutual + 3 death/KO       -> Nemesis
#
# Paste under your existing CustomAlias: section
# (do NOT paste a second "CustomAlias:" root if one already exists).
#
# IMPORTANT: use asFakeOp! (asOp! does not fire triggers on this server)
# Then: /cmi reload
# ============================================================

CustomAlias:
  rival:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] $1-
    AddTabs: true
    ExactMatch: false

  rivaldeclare:
    Cmds:
    - asFakeOp! noppes script trigger 201 [playerName] $1-
    AddTabs: true
    ExactMatch: false

  rivalaccept:
    Cmds:
    - asFakeOp! noppes script trigger 202 [playerName] $1-
    AddTabs: true
    ExactMatch: false

  rivaldecline:
    Cmds:
    - asFakeOp! noppes script trigger 203 [playerName] $1-
    AddTabs: true
    ExactMatch: false

  rivalremove:
    Cmds:
    - asFakeOp! noppes script trigger 204 [playerName] $1-
    AddTabs: true
    ExactMatch: false

  rivallist:
    Cmds:
    - asFakeOp! noppes script trigger 205 [playerName]
    AddTabs: true
    ExactMatch: true

  rivalstats:
    Cmds:
    - asFakeOp! noppes script trigger 206 [playerName] $1-
    AddTabs: true
    ExactMatch: false

  rivaltop:
    Cmds:
    - asFakeOp! noppes script trigger 220 [playerName] $1-
    AddTabs: true
    ExactMatch: false

  rivalhelp:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] help
    AddTabs: true
    ExactMatch: true
