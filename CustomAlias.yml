#
# Edit custom variables in game if possible
# Some extra variables can be used, like [playerName] will insert senders name automatically
# All global variables should work, you can find full list in locale file
# You can add delay between commands by inserting line like
# delay! 5
# This will delay next commands by defines time in seconds
# If command is shortened and you need to provide some changing variables like target player name you need to define what and where it should be placed
# Example: /cmi heal Zrips 
# Can be shortened with custom alias to something like /h zrips by using alias command like
# cmi heal $1
# If you need to add more than one variable, use $1- format. Number represents variable place when used in alias command
# Example: cmi tppos $1-
# In case you want to print out help page if player enters wrong subcommand, use ? in alias
# Example: ca ?
# In this case if player performs /ca wrongsub or /ca anotherwrong
# Commands under this alias will get executed. Exelent way to show help page and correct usage if needed
#
# Rival commands use Rival Command Handler.js (script-slot with SkillCheck / Spar).
# Format: asFakeOp! noppes script trigger <id> [playerName] [$1...]

CustomAlias:
  ResetSaga:
    Cmds:
    - asConsole! dmzquest resetsaga all [playerName]
    AddTabs: true
    ExactMatch: true
    CustomTabs:
    - ResetSaga
  Tutorial:
    Cmds:
    - asConsole! noppes dialog show [playerName] 4 Server
    AddTabs: true
    ExactMatch: true
  Rules:
    Cmds:
    - asConsole! ctext rules [playerName]
    AddTabs: true
    ExactMatch: true
  SkillCheck:
    Cmds:
    - asFakeOp! noppes script trigger 21 [playerName]
    Perm: true
    ExactMatch: true
  Terminal:
    Cmds:
    - asConsole! class forcecast [playerName] terminal
    Perm: true
    AddTabs: true
    ExactMatch: true
  Revive:
    Cmds:
    - asFakeOp! dmzrevive [playerName]
    Perm: true
    ExactMatch: true
  Aura:
    Cmds:
    - AsPlayer! pp gui presets
    Perm: true
    AddTabs: true
    ExactMatch: true
  Halo:
    Cmds:
    - asConsole! dmzhalo on [playerName]
    Perm: true
    AddTabs: true
    ExactMatch: true
  RemoveHalo:
    Cmds:
    - asConsole! dmzhalo off [playerName]
    Perm: true
    AddTabs: true
    ExactMatch: true
  Weights:
    Cmds:
    - AsConsoles! dmzweight $1-
    Perm: true
    AddTabs: true
    ExactMatch: true
  ShopSpawn:
    Cmds:
    - asfakeop! warp shopspawn [playerName]
    Perm: true
    AddTabs: true
    ExactMatch: true
  TPBoost:
    Cmds:
    - asFakeOp! noppes script trigger 30 $4 $3 $2 $1
    Perm: true
    AddTabs: true
    ExactMatch: true
  discord:
    Cmds:
    - asConsole! minecraft:tellraw [playerName] {"text":"--------------------------------","color":"dark_gray","strikethrough":true}
    - asConsole! minecraft:tellraw [playerName] {"text":"Official Discord","color":"aqua","bold":true}
    - asConsole! minecraft:tellraw [playerName] {"text":"Join the DBZ Legacy Reborn
      community!","color":"gray"}
    - asConsole! minecraft:tellraw [playerName] {"text":"[ CLICK TO JOIN OUR DISCORD
      ]","color":"aqua","bold":true,"underlined":true,"clickEvent":{"action":"open_url","value":"https://discord.gg/eRNs935hUM"}}
    - asConsole! minecraft:tellraw [playerName] {"text":"--------------------------------","color":"dark_gray","strikethrough":true}
    AddTabs: true
    ExactMatch: true
