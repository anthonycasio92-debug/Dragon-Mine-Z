    AddTabs: true
    ExactMatch: true
  rivaljournal:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] journal $1-
    AddTabs: true
    ExactMatch: false
  rivalseason:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] season
    AddTabs: true
    ExactMatch: true
  rivalquests:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] quests
    AddTabs: true
    ExactMatch: true
  rivalachievements:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] achievements
    AddTabs: true
    ExactMatch: true
  rivalhof:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] hof
    AddTabs: true
    ExactMatch: true
  challengeaccept:
    Cmds:
    - asFakeOp! noppes script trigger 210 [playerName] accept $1-
    AddTabs: true
    ExactMatch: false
  challengedecline:
    Cmds:
    - asFakeOp! noppes script trigger 210 [playerName] decline $1-
    AddTabs: true
    ExactMatch: false
  challengecancel:
    Cmds:
    - asFakeOp! noppes script trigger 210 [playerName] cancel
    AddTabs: true
    ExactMatch: true
