#
# Rival aliases - same syntax as in-game /rival help.
# Prefer using the full CustomAlias.yml (repo root / rival-v4/cmi/).
#
# Primary:
#   /rival <player>
#   /rival declare|accept|decline|remove <player>
#   /rival list | stats [player] | top [cat]
#   /rival title | journal | season | quests | achievements | hof
#   /challenge <player>
#   /challenge rival <player>
#   /challenge accept | decline | cancel
#   /spectaterival <player>
#
# All route through Rival Command Handler.js:
#   rival     -> trigger 200 [playerName] $1-
#   challenge -> trigger 210 [playerName] $1-
#   spectaterival -> trigger 230 [playerName] $1-
#
# One-word shortcuts (rivalaccept, challengecancel, etc.) inject the
# same subcommand words into those routers.
#

CustomAlias:
  rival:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] $1-
    AddTabs: true
    ExactMatch: false
  challenge:
    Cmds:
    - asFakeOp! noppes script trigger 210 [playerName] $1-
    AddTabs: true
    ExactMatch: false
  spectaterival:
    Cmds:
    - asFakeOp! noppes script trigger 230 [playerName] $1-
    AddTabs: true
    ExactMatch: false
  rivaldeclare:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] declare $1-
    AddTabs: true
    ExactMatch: false
  rivalaccept:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] accept $1-
    AddTabs: true
    ExactMatch: false
  rivaldecline:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] decline $1-
    AddTabs: true
    ExactMatch: false
  rivalremove:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] remove $1-
    AddTabs: true
    ExactMatch: false
  rivallist:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] list
    AddTabs: true
    ExactMatch: true
  rivalstats:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] stats $1-
    AddTabs: true
    ExactMatch: false
  rivaltop:
    Cmds:
    - asFakeOp! noppes script trigger 200 [playerName] top $1-
    AddTabs: true
    ExactMatch: false
  rivaltitle:
    Cmds:
