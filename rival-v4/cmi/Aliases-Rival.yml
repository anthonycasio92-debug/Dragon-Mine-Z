# ============================================================
# DBZ Legacy Reborn - Rival CMI Aliases (asFakeOp!)
# ============================================================
# Paste into CMI Aliases.yml then: /cmi reload
#
# WHY asFakeOp!
# noppes script trigger must be run as a player source (not console).
#
# WHY script-slot RivalRouter (NOT Global Player scripts for commands)
# CustomNPCs EventHooks skips FakePlayer for Global Player scripts,
# but Forge/script-slot handlers still receive the trigger.
# RivalRouter_v4.js reads the REAL player from [playerName] (arg0).
#
# Place RivalRouter_v4.js with SkillCheckCommand / Sparring Command Handler.
# ============================================================

rival:
  Cmds:
  - asFakeOp! noppes script trigger 200 [playerName]
  Help: '&6/rival &7- Rival help'

rivaldeclare:
  Cmds:
  - asFakeOp! noppes script trigger 201 [playerName] $1
  Help: '&6/rivaldeclare <player> &7- Declare a rival'

rivalaccept:
  Cmds:
  - asFakeOp! noppes script trigger 202 [playerName] $1
  Help: '&6/rivalaccept <player> &7- Accept rivalry'

rivaldecline:
  Cmds:
  - asFakeOp! noppes script trigger 203 [playerName] $1
  Help: '&6/rivaldecline <player> &7- Decline rivalry'

rivalremove:
  Cmds:
  - asFakeOp! noppes script trigger 204 [playerName] $1
  Help: '&6/rivalremove <player> &7- Remove rivalry'

rivallist:
  Cmds:
  - asFakeOp! noppes script trigger 205 [playerName]
  Help: '&6/rivallist &7- List rivals'

rivalstats:
  Cmds:
  - asFakeOp! noppes script trigger 206 [playerName] $1-
  Help: '&6/rivalstats [player] &7- Stats'

rivaltop:
  Cmds:
  - asFakeOp! noppes script trigger 220 [playerName] $1-
  Help: '&6/rivaltop [rp|wins|streak|damage|combo|hit|battles]'

rivaltitle:
  Cmds:
  - asFakeOp! noppes script trigger 221 [playerName]
  Help: '&6/rivaltitle &7- Title + perks'

rivaljournal:
  Cmds:
  - asFakeOp! noppes script trigger 222 [playerName] $1-
  Help: '&6/rivaljournal [player]'

rivalseason:
  Cmds:
  - asFakeOp! noppes script trigger 223 [playerName]
  Help: '&6/rivalseason'

rivalquests:
  Cmds:
  - asFakeOp! noppes script trigger 224 [playerName]
  Help: '&6/rivalquests'

rivalachievements:
  Cmds:
  - asFakeOp! noppes script trigger 225 [playerName]
  Help: '&6/rivalachievements'

rivalhof:
  Cmds:
  - asFakeOp! noppes script trigger 226 [playerName]
  Help: '&6/rivalhof'

challenge:
  Cmds:
  - asFakeOp! noppes script trigger 210 [playerName] $1
  Help: '&6/challenge <player> &7- Official rival battle'

challengeaccept:
  Cmds:
  - asFakeOp! noppes script trigger 211 [playerName] $1-
  Help: '&6/challengeaccept [player]'

challengedecline:
  Cmds:
  - asFakeOp! noppes script trigger 212 [playerName] $1-
  Help: '&6/challengedecline [player]'

challengecancel:
  Cmds:
  - asFakeOp! noppes script trigger 213 [playerName]
  Help: '&6/challengecancel'

spectaterival:
  Cmds:
  - asFakeOp! noppes script trigger 230 [playerName] $1
  Help: '&6/spectaterival <player>'
