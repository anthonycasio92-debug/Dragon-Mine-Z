# ============================================================
# DBZ Legacy Reborn - Sparring CMI Aliases (v3)
# ============================================================
# Requires Sparring Tp System.js v3.0.4+ (Global Player) with
# the trigger event enabled (handles ids 70, 72-79).
#
# Optional: also install Sparring Command Handler.js in a
# player script-slot (responses are deduped if both exist).
#
# In-game:
#   /spar
#   /spar help
#   /spar stats [player]
#   /spar top [tp|streak|session|payout|perfect|time|combo|clash]
#
# [playerName] MUST be argument 0 for the script.
# $1- passes the rest of the typed args.
#
# Paste into CMI CustomAlias.yml then: /cmi reload
# ============================================================

CustomAlias:
  spar:
    Cmds:
    - asOp! noppes script trigger 70 [playerName] $1-
    AddTabs: true
    ExactMatch: false

  sparstats:
    Cmds:
    - asOp! noppes script trigger 70 [playerName] stats $1-
    AddTabs: true
    ExactMatch: false

  spartop:
    Cmds:
    - asOp! noppes script trigger 70 [playerName] top $1-
    AddTabs: true
    ExactMatch: false

  sparstreak:
    Cmds:
    - asOp! noppes script trigger 70 [playerName] top streak
    AddTabs: true
    ExactMatch: true

  sparsession:
    Cmds:
    - asOp! noppes script trigger 70 [playerName] top session
    AddTabs: true
    ExactMatch: true

  sparlongest:
    Cmds:
    - asOp! noppes script trigger 70 [playerName] top session
    AddTabs: true
    ExactMatch: true

  sparpayout:
    Cmds:
    - asOp! noppes script trigger 70 [playerName] top payout
    AddTabs: true
    ExactMatch: true

  sparperfect:
    Cmds:
    - asOp! noppes script trigger 70 [playerName] top perfect
    AddTabs: true
    ExactMatch: true

  spartime:
    Cmds:
    - asOp! noppes script trigger 70 [playerName] top time
    AddTabs: true
    ExactMatch: true

  sparhelp:
    Cmds:
    - asOp! noppes script trigger 70 [playerName] help
    AddTabs: true
    ExactMatch: true
