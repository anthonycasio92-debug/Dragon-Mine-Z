# ============================================================
# DBZ Legacy Reborn - Sparring CMI Aliases (v3.1.2) — OPTIONAL
# ============================================================
# Sparring Tp System.js v3.1.2+ already handles:
#   /spar ...   (Bukkit slash hook, no CMI needed)
#   .spar ...   !spar ...   ./spar ...   (chat fallback)
#
# Paste these ONLY if you still want CMI aliases / tab-complete.
# Merge the keys under your existing CustomAlias: section
# (do NOT paste a second "CustomAlias:" root if one already exists).
#
# Then: /cmi reload
# ============================================================

# spar:
#   Cmds:
#   - asFakeOp! noppes script trigger 70 [playerName] $1-
#   AddTabs: true
#   ExactMatch: false
#
# sparstats:
#   Cmds:
#   - asFakeOp! noppes script trigger 70 [playerName] stats $1-
#   AddTabs: true
#   ExactMatch: false
#
# spartop:
#   Cmds:
#   - asFakeOp! noppes script trigger 70 [playerName] top $1-
#   AddTabs: true
#   ExactMatch: false
#
# sparhelp:
#   Cmds:
#   - asFakeOp! noppes script trigger 70 [playerName] help
#   AddTabs: true
#   ExactMatch: true

CustomAlias:
  spar:
    Cmds:
    - asFakeOp! noppes script trigger 70 [playerName] $1-
    AddTabs: true
    ExactMatch: false

  sparstats:
    Cmds:
    - asFakeOp! noppes script trigger 70 [playerName] stats $1-
    AddTabs: true
    ExactMatch: false

  spartop:
    Cmds:
    - asFakeOp! noppes script trigger 70 [playerName] top $1-
    AddTabs: true
    ExactMatch: false

  sparstreak:
    Cmds:
    - asFakeOp! noppes script trigger 70 [playerName] top streak
    AddTabs: true
    ExactMatch: true

  sparsession:
    Cmds:
    - asFakeOp! noppes script trigger 70 [playerName] top session
    AddTabs: true
    ExactMatch: true

  sparlongest:
    Cmds:
    - asFakeOp! noppes script trigger 70 [playerName] top session
    AddTabs: true
    ExactMatch: true

  sparpayout:
    Cmds:
    - asFakeOp! noppes script trigger 70 [playerName] top payout
    AddTabs: true
    ExactMatch: true

  sparperfect:
    Cmds:
    - asFakeOp! noppes script trigger 70 [playerName] top perfect
    AddTabs: true
    ExactMatch: true

  spartime:
    Cmds:
    - asFakeOp! noppes script trigger 70 [playerName] top time
    AddTabs: true
    ExactMatch: true

  sparhelp:
    Cmds:
    - asFakeOp! noppes script trigger 70 [playerName] help
    AddTabs: true
    ExactMatch: true
